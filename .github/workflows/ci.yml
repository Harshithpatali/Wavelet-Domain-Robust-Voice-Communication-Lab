name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r call_service/requirements.txt

      - name: Set up Node.js for live wavelet DSP tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test live wavelet audio transform
        run: node --test tests/wavelet_audio_worklet.test.cjs

      - name: Compile Python files
        run: python -m compileall -q app.py run_experiment.py src tests call_service

      - name: Run tests
        run: pytest -q

      - name: Build private-call Docker image
        run: docker build --file call_service/Dockerfile --tag wavelet-private-call-signaling:test .
