services:
  - type: web
    name: wavelet-private-call-signaling
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r call_service/requirements.txt
    startCommand: uvicorn call_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: CALL_CREATION_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://wavelet-domain-robust-voice-communication-lab.streamlit.app
